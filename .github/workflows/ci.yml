name: Synthetic Application CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --requirement requirements-ci.lock
          pip install --requirement requirements-dev.txt
          # spaCy selects a compatible model version; requirements-ci.lock pins spaCy.
          python -m spacy download en_core_web_sm

      - name: Run full test suite with coverage
        run: |
          python -m pytest -v tests --cov=. --cov-report=term-missing --cov-report=xml
          python -m coverage report > coverage.txt

      - name: Lint with Ruff
        run: ruff check .

      - name: Type-check with mypy
        run: python -m mypy

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage.txt
