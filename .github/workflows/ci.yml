name: Synthetic Application CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --requirement requirements-ci.lock

      - name: Run full test suite with coverage
        run: |
          python -m pytest -v --cov=. --cov-report=term-missing --cov-report=xml

      - name: Lint with Ruff
        run: ruff check .

      - name: Type-check with mypy
        run: mypy app.py predictor.py preprocessor.py routers scripts train_production.py

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
