[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["docs/audit_archive", "evaluation_results", "notebooks"]
# Archived historical artifacts, not maintained code; exclude them explicitly in every checkout.
extend-exclude = ["docs/audit_archive/**", "evaluation_results/**", "notebooks/**", ".venv*"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
explicit_package_bases = true
mypy_path = "."
files = [
    "app.py",
    "config.py",
    "predictor.py",
    "preprocessor.py",
    "distilbert_predictor.py",
    "artifact_contract.py",
    "duplicate_aware_manifest.py",
    "routers",
]
exclude = "^(experiments|docs|evaluation_results|notebooks|legacy|scripts|train_production.py|phase2_calibration.py)/"

# The duplicate-aware planner is a data-analysis utility with dynamically typed
# pandas/numpy structures. It remains in the checked production surface, but
# its 60+ inference errors are not actionable without a separate refactor.
[[tool.mypy.overrides]]
module = "duplicate_aware_manifest"
ignore_errors = true
